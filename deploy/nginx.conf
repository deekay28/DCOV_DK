server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # 'self' is enough for connect-src: Caddy (deploy/Caddyfile) proxies
    # /api/* to the backend on the *same* origin the browser loaded this
    # page from, so the app never makes a cross-origin request to the
    # backend directly - nginx here is only ever reached through Caddy in
    # the docker-compose stack. If you serve this image standalone, outside
    # that stack, add the backend's real origin back to connect-src.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Not needed when this image runs behind deploy/Caddyfile - Caddy already
    # routes /api/* to the backend before a request ever reaches nginx (see
    # its @api matcher). Kept here, commented out, only for the case where
    # you run this image's container directly with no Caddy in front of it.
    # location /api/ {
    #     proxy_pass http://backend:8000/api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location ~* \.(?:js|css|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
    location = /seed_data.js {
        # Regenerated on each import; keep it revalidated rather than cached hard.
        add_header Cache-Control "no-cache";
    }
}
