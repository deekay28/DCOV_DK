# Debugging aid only - publishes backend/web ports directly to the host so
# you can curl the API or hit Swagger UI without going through Caddy/TLS.
# Never use this in a deployment reachable from anywhere but your own
# machine; it defeats the "backend is only reachable through the proxy"
# guarantee docker-compose.yml is built around.
#
# Usage:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.debug.yml \
#     --env-file deploy/.env up -d --build
services:
  backend:
    environment:
      DCOV_FORCE_HTTPS: "false"
      DCOV_CORS_ORIGINS: '["http://localhost:8080","http://localhost:3000"]'
    ports:
      - "8000:8000"
  web:
    ports:
      - "8080:80"
