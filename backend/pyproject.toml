[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = [
  "E501",   # line length is a soft target here (long docstrings/URLs) - not a build gate
  "B008",   # FastAPI's Depends(...) as a default argument is the intended pattern
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false   # tighten incrementally - not everything is annotated yet
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["cv2", "easyocr", "pytesseract", "reportlab.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "migrations"]
skips = ["B101"]   # assert is fine outside of security-critical paths in this codebase

[tool.coverage.run]
source = ["app"]
omit = ["app/services/ocr.py"]   # exercised by hardware-dependent paths pytest can't reach

[tool.coverage.report]
show_missing = true
skip_empty = true
